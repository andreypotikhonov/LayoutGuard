name: Build and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test correction engine
        run: dotnet run --project Windows/tests/LayoutGuard.Core.Checks/LayoutGuard.Core.Checks.csproj -c Release

      - name: Test Windows text replacement and layout switching
        run: dotnet run --project Windows/tests/LayoutGuard.Windows.Checks/LayoutGuard.Windows.Checks.csproj -c Release

      - name: Publish Windows x64
        run: >-
          dotnet publish Windows/src/LayoutGuard.Windows/LayoutGuard.Windows.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -o Windows/artifacts/publish

      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path Windows/artifacts/publish/* -DestinationPath Windows/artifacts/LayoutGuard-Portable-x64.zip

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          choco install nsis -y
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" Windows\installer\LayoutGuard.nsi

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: LayoutGuard-Portable-x64
          path: Windows/artifacts/LayoutGuard-Portable-x64.zip

      - name: Download current macOS application for combined release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release download v0.4.2 --pattern LayoutGuard.zip --dir Windows/artifacts

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          gh release create "${{ github.ref_name }}"
          Windows/artifacts/installer/LayoutGuard-Setup.exe
          Windows/artifacts/LayoutGuard-Portable-x64.zip
          Windows/artifacts/LayoutGuard.zip
          --title "LayoutGuard ${{ github.ref_name }} — macOS and Windows"
          --generate-notes
